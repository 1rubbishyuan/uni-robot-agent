# DexJoCo OpenPI and its pure-Python client disagree on NumPy metadata.
# Keep the model's NumPy 2 dependency; install the pinned client without dependency resolution.
# Only the exact verified client metadata discrepancy is admitted by setup.
name = "actor-dexjoco-pick-bucket"
python = "python3.11"
repository = "https://github.com/brave-eai/dexjoco.git"
revision = "8d23b0fab23b17a58c4b55f3942e17013aaf8267"
installer = "pip"
project = "openpi"
client_project = "openpi/packages/openpi-client"
submodules = false
asset_repository = "DexJoCo/DexJoCo-Pi05"
asset_revision = "8d253e04e1b82c452c5804273939ff7f002f217f"
asset_repo_type = "model"
asset_patterns = ["pi05_dexjoco_ckpt/pick_bucket/params/**", "pi05_dexjoco_ckpt/pick_bucket/assets/**"]
packages = ["lerobot==0.4.4", "msgpack==1.1.2", "tree==0.2.4", "websockets==15.0.1"]
constraints = ["numpy==2.2.6", "jax==0.5.3", "jaxlib==0.5.3", "flax==0.10.2", "orbax-checkpoint==0.11.13", "equinox==0.12.2", "augmax==0.4.1", "numpydantic==1.6.9", "pydantic==2.11.5", "optax==0.2.4", "torch==2.7.1", "torchvision==0.22.1", "datasets==4.8.5", "transformers==4.53.2", "lerobot==0.4.4", "tyro==0.9.22", "etils==1.12.2", "sentencepiece==0.2.0", "evdev==1.9.2", "pynput==1.8.1"]
dependency_exceptions = ["openpi-client 0.1.0 has requirement numpy==1.26.4, but you have numpy 2.2.6."]

[actor]
model = "pi05"
runtime = "openpi_jax"
model_config_name = "pick_bucket"
source_revision = "8d23b0fab23b17a58c4b55f3942e17013aaf8267"
source_sha256 = "6f7d32c7853e8731260d1e9aa3f33959c1e523b283411bb0f311e7e7d3508ede"
source_files_sha256 = {"openpi/config.yaml" = "a085b5e6fe5922585e9404bc6012e1bdfb6fec9a8e5158097632089f263a479f"}
pythonpath = ["openpi/src", "openpi/packages/openpi-client/src"]
assets_id = "local_repo"
working_directory = "openpi"
inference_mode = "single"
image_keys = {"front" = "base", "wrist" = "wrist"}
image_container = ""
image_layout = "HWC"
policy_rng_seed = 0

