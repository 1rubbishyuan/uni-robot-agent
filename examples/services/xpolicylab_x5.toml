  { name = "right_joint_5", unit = "rad", semantics = "joint_position", frame = "arx_x5_joint" },
  { name = "right_gripper", unit = "normalized", semantics = "normalized_opening", minimum = 0, maximum = 1 },
]
action_fields = [
