backend = "openpi"
profile = "behavior_r1pro_pi05"
native_root = "/path/to/pinned/openpi"
checkpoint = "/path/to/r1pro/checkpoint"
checkpoint_sha256 = "REPLACE_WITH_VERIFIED_CHECKPOINT_SHA256"

[http]
host = "127.0.0.1"
port = 18761

[batching]
max_batch_size = 1
max_wait_ms = 5
max_queue_size = 64

[sessions]
max_sessions = 1024
idle_timeout_s = 1800
receipt_ttl_s = 3600
max_receipts = 128
max_session_requests = 4096
