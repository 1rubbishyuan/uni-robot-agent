# Obtain checkpoint_sha256 from the matching actor setup runtime manifest.
backend = "gr00t"
profile = "arena_g1_gr00t"
native_root = "/path/to/pinned/Isaac-GR00T"
checkpoint = "/path/to/pinned/GN1x-Tuned-Arena-G1-Loco-Manipulation"
checkpoint_sha256 = "REPLACE_WITH_VERIFIED_CHECKPOINT_SHA256"

[http]
